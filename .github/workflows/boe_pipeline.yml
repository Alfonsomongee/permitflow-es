name: Pipeline BOE v2 — Actualización normativa automática

on:
  schedule:
    - cron: '0 7 * * 1'   # Lunes 9:00 España — después del fin de semana
    - cron: '0 7 * * 4'   # Jueves 9:00 España — mitad de semana
  workflow_dispatch:        # Ejecución manual desde GitHub Actions

permissions:
  contents: write        # push de la rama con los borradores
  pull-requests: write   # abrir el PR de revisión humana
  issues: write          # avisar si el pipeline falla

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3

      - name: Instalar dependencias
        working-directory: apps/api
        # `supabase` ya es dependencia de apps/api: no se modifica pyproject/uv.lock
        # en el runner (antes se ejecutaba `uv add supabase`).
        run: uv sync --frozen

      - name: Ejecutar pipeline BOE v2
        working-directory: apps/api
        env:
          DEEPSEEK_API_KEY:       ${{ secrets.DEEPSEEK_API_KEY }}
          RESEND_API_KEY:         ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL:     ${{ secrets.NOTIFICATION_EMAIL }}
          RESEND_FROM_DOMAIN:     ${{ secrets.RESEND_FROM_DOMAIN }}
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENVIRONMENT: production
          # config.Settings exige SECRET_KEY sin valor por defecto. Sin ella el
          # script moría en ~1 s al importar `config` y TODAS las ejecuciones
          # programadas (#18-#28) fallaban. El pipeline no firma nada con ella.
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'pipeline-boe-no-usa-esta-clave' }}
        run: uv run python scripts/boe_pipeline.py

      - name: Subir borradores como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: borradores-${{ github.run_id }}
          path: apps/api/motor_normativo/borradores/
          if-no-files-found: ignore
          retention-days: 30

      - name: Abrir PR si hay borradores con diff aplicable
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(normativa): actualización automática pipeline BOE"
          title: "🔔 Actualización normativa detectada por pipeline BOE"
          body: |
            El pipeline BOE ha detectado cambios normativos relevantes.
            
            Revisa los borradores en `apps/api/motor_normativo/borradores/`
            y los JSONs modificados antes de hacer merge.
            
            **Acción requerida:** Revisar y aprobar los cambios en el motor normativo.
          branch: "normativa/pipeline-${{ github.run_id }}"
          delete-branch: true
          labels: "normativa,automated"

      - name: Avisar si el pipeline ha fallado
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Pipeline BOE fallido ($(date -u +%Y-%m-%d))" \
            --body "La ejecución programada del pipeline BOE ha fallado. Revisa el log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "normativa,automated" || true
