name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        # next build no detecta errores de tipos en ficheros huérfanos que
        # ningún componente importa (p.ej. *.test.ts) — comprobado de forma
        # empírica el 2026-08-20: un error de tipos real en un test pasaba
        # el build en verde. tsc --noEmit sí los detecta.
        run: pnpm --filter web exec tsc --noEmit

      - name: Test
        # Antes no existía este paso: el job solo compilaba (`next build`),
        # así que los 165 tests de apps/web/lib/**/*.test.ts nunca se
        # ejecutaban en CI pese a existir y pasar en local (auditoría de
        # testing, 2026-08-20).
        run: pnpm --filter web test

      - name: Build web
        run: pnpm --filter web build

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      # Mínimo para que pytest pueda siquiera recoger los tests: Settings()
      # exige SECRET_KEY sin default (config.py) y el cliente de IA
      # (servicios/ai_client.py) construye AsyncOpenAI a nivel de módulo, así
      # que sin DEEPSEEK_API_KEY la simple importación fallaba antes de
      # ejecutar un solo test. No son secretos reales -- son válidos solo
      # para que el proceso arranque; ningún test debe depender de que
      # apunten a un servicio real. Antes de este cambio, el job llevaba
      # 13/13 ejecuciones en fallo en todo el historial del repositorio,
      # las 13 en el paso "Run tests" en ~4 segundos (fallo de colección, no
      # de un test real) — auditoría de testing, 2026-08-20.
      SECRET_KEY: ci-test-secret-not-for-production-use
      ENVIRONMENT: development
      DEEPSEEK_API_KEY: ci-test-key-not-for-production-use
      # INTERNAL_API_KEY: los tests de routers/contacto.py y routers/
      # newsletter.py construyen la cabecera X-Internal-Key con
      # settings.INTERNAL_API_KEY; sin valor, httpx revienta al construir la
      # petición (TypeError, no un 401 limpio).
      INTERNAL_API_KEY: ci-test-internal-key-not-for-production-use
      # RESEND_API_KEY / NOTIFICATION_EMAIL: routers/contacto.py devuelve 503
      # si faltan (comportamiento correcto), pero los tests que simulan un
      # envío exitoso mockean resend.Emails.send y necesitan que la
      # comprobación de configuración pase primero.
      RESEND_API_KEY: ci-test-resend-key-not-for-production-use
      NOTIFICATION_EMAIL: ci-test@example.com
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        # Los tests que parecían necesitar Postgres/Redis reales
        # (test_contacto, test_newsletter, test_simulador,
        # test_validacion_mensajes_espanol) en realidad no lo necesitan: ya
        # sobrescriben get_db/get_redis con fakes propios. Lo que faltaba
        # eran las variables de entorno de arriba y un bug real en
        # main.py::_barrer_estudios_expirados (llamaba a AsyncSessionLocal()
        # sin comprobar que fuera None, y como corre en un
        # asyncio.create_task de fondo, el TypeError solo se veía al cerrar
        # el TestClient de cualquier test, tocara o no la base de datos).
        # Verificado: 1326/1326 tests pasan sin ningún servicio de base de
        # datos en este job (auditoría de testing, 2026-08-20).
        run: uv run pytest
